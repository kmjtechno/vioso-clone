name: M7 Bounded Python Regression
on:
  push:
    branches:
      - feat/m7-readonly-sps-header-probe-20261104
permissions:
  contents: read
jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install only necessary test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless
      - name: M5 and M6 security regression
        run: python -m pytest tests/test_m5_sps.py tests/test_m6_sps_hardening.py -q
      - name: M7 metadata probe
        run: python -m pytest tests/test_m7_sps_probe.py -q
      - name: Full project regression
        run: python -m pytest -q
