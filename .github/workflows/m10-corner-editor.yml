name: M10 Camera Corner Editor Regression
on:
  push:
    branches:
      - feat/m10-camera-corner-editor-20261104
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python and Qt dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless PySide6
      - name: M10 corner geometry and real Qt GUI smoke
        run: python -m pytest tests/test_m10_corner_model.py tests/test_m10_corner_qt.py -q
      - name: Full application regression
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 16
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python and Qt dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless PySide6
      - name: M10 corner geometry and real Qt GUI smoke
        run: python -m pytest tests/test_m10_corner_model.py tests/test_m10_corner_qt.py -q
      - name: Full application regression
        run: python -m pytest -q
