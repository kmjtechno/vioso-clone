name: M42 Windows Portable Alpha Prerelease
on:
  push:
    branches: [main]
    paths:
      - "vclone/portable_entry.py"
      - "tests/test_m42_portable_entry.py"
      - ".github/workflows/m42-windows-prerelease.yml"
      - "docs/M42_WINDOWS_PORTABLE_GUI.md"
permissions:
  contents: read

jobs:
  windows-prerelease:
    if: github.repository == 'kmjtechno/vioso-clone'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install open-source build and test dependencies
        run: python -m pip install --disable-pip-version-check --no-input ".[gui,test]" "pyinstaller>=6.17,<7"
      - name: All source regressions and safe GUI self-test
        run: |
          python -m pytest -q
          python -m vclone.portable_entry --self-test
      - name: Build the tested hidden-console Windows bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean --onedir --console --hide-console hide-early --name KMJ-VIOSO-Clone --paths . --collect-submodules vclone vclone/portable_entry.py
          if ($LASTEXITCODE -ne 0) { throw "M42_PRERELEASE_BUILD_FAILED" }
          $exe = Join-Path $PWD "dist/KMJ-VIOSO-Clone/KMJ-VIOSO-Clone.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "M42_PRERELEASE_EXE_MISSING" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "M42_PRERELEASE_FROZEN_GUI_FAILED" }
          Write-Output "M42_PRERELEASE_FROZEN_GUI_NO_HARDWARE=PASS"
      - name: Archive and re-test extracted ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $PWD "dist/KMJ-VIOSO-Clone"
          $zip = Join-Path $PWD "dist/KMJ-VIOSO-Clone-alpha-win64.zip"
          if (Test-Path -LiteralPath $zip) { throw "M42_PRERELEASE_ZIP_TARGET_EXISTS" }
          Compress-Archive -LiteralPath $folder -DestinationPath $zip -CompressionLevel Optimal
          $size = (Get-Item -LiteralPath $zip -ErrorAction Stop).Length
          if ($size -le 0 -or $size -ge 2147483648) { throw "M42_PRERELEASE_ZIP_INVALID_OR_OVER_2GIB" }
          $extract = Join-Path $env:RUNNER_TEMP "m42-prerelease-extract"
          if (Test-Path -LiteralPath $extract) { throw "M42_PRERELEASE_EXTRACT_TARGET_EXISTS" }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $exe = Join-Path $extract "KMJ-VIOSO-Clone/KMJ-VIOSO-Clone.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "M42_PRERELEASE_EXTRACTED_EXE_MISSING" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "M42_PRERELEASE_EXTRACTED_GUI_FAILED" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($hash -notmatch '^[0-9A-F]{64}$') { throw "M42_PRERELEASE_DIGEST_INVALID" }
          Write-Output ("M42_PRERELEASE_ZIP_SHA256=" + $hash)
          Write-Output ("M42_PRERELEASE_ZIP_BYTES=" + $size)
          Write-Output "M42_PRERELEASE_EXTRACTED_GUI_NO_HARDWARE=PASS"
          Write-Output "M42_HARDWARE_OPTICAL_ACCEPTANCE=NOT_VERIFIED"
          Write-Output "M42_NATIVE_VIOSO7_SPS_PARITY=NOT_VERIFIED"
          Write-Output "M42_AUTHENTICODE_SIGNED=NO"
      - name: Publish verified ZIP as PRIVATE GitHub prerelease asset, never Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:GITHUB_EVENT_NAME -ne 'push') {
            throw 'M42_PRERELEASE_MAIN_PUSH_REQUIRED'
          }
          $sha = $env:GITHUB_SHA
          if ($sha -notmatch '^[0-9a-fA-F]{40}$') { throw 'M42_PRERELEASE_SHA_INVALID' }
          $tag = 'vclone-alpha-win-' + $sha.Substring(0, 12)
          $zip = Join-Path $PWD 'dist/KMJ-VIOSO-Clone-alpha-win64.zip'
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'M42_PRERELEASE_ZIP_NOT_FOUND' }
          $ghExe = Get-Command gh -CommandType Application -ErrorAction Stop | Select-Object -First 1
          if ($null -eq $ghExe -or -not $ghExe.Source) { throw 'M42_GH_CLI_UNAVAILABLE' }
          Write-Output 'M42_GH_CLI_PRESENT=PASS'
          $notes = 'UNSIGNED experimental independent KMJ VIOSO Clone alpha. P520 install and camera/projector optical acceptance NOT VERIFIED. Proprietary VIOSO 7 SPS parity NOT VERIFIED. Do not disable Windows security controls. See docs/M42_WINDOWS_PORTABLE_GUI.md.'
          gh release create $tag $zip --repo kmjtechno/vioso-clone --target $sha --title ('KMJ VIOSO Clone unsigned Windows alpha ' + $sha.Substring(0, 12)) --notes $notes --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'M42_PRERELEASE_CREATE_OR_UPLOAD_FAILED' }
          $summary = (gh release view $tag --repo kmjtechno/vioso-clone --json url,tagName,isPrerelease,assets | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or -not $summary.isPrerelease -or $summary.tagName -ne $tag) { throw 'M42_PRERELEASE_METADATA_UNVERIFIED' }
          $assets = @($summary.assets | Where-Object { $_.name -eq 'KMJ-VIOSO-Clone-alpha-win64.zip' })
          if ($assets.Count -ne 1 -or $assets[0].size -le 0) { throw 'M42_PRERELEASE_BINARY_ASSET_UNVERIFIED' }
          Write-Output ('M42_PRERELEASE_URL=' + $summary.url)
          Write-Output 'M42_PRERELEASE_ASSET_UPLOADED=PASS'
