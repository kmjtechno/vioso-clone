name: M16 Versioned Alpha Wheel Release
on:
  push:
    branches: [release/vclone-alpha-20261104]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  linux-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux Qt runtime
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0
      - name: Install test/build requirements
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless PySide6 build
      - name: Package metadata and installed CLI tests
        run: python -m pytest tests/test_m12_packaging.py -q
      - name: Full source regression
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Publish short-lived alpha wheel artifact
        # PRs build and install the wheel but avoid accumulating artifacts;
        # actual release pushes retain the downloadable wheel requirement.
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kmj-vioso-clone-0.2.0a1-wheel
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error
      - name: Install wheel without changing test dependencies
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Inspect installed distribution outside checkout
        run: cd "$RUNNER_TEMP" && python -c "from importlib.metadata import version; assert version('kmj-vioso-clone') == '0.2.0a1'" && cd "$RUNNER_TEMP" && vclone --help

  windows-wheel:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test/build requirements
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless PySide6 build
      - name: Package metadata and installed CLI tests
        run: python -m pytest tests/test_m12_packaging.py -q
      - name: Full source regression
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel without changing test dependencies
        shell: pwsh
        run: python -m pip install --force-reinstall --no-deps (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
      - name: Inspect installed distribution outside checkout
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          python -c "from importlib.metadata import version; assert version('kmj-vioso-clone') == '0.2.0a1'"
          vclone --help
