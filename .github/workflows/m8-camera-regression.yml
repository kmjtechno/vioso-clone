name: M8 Camera Capture Regression
on:
  push:
    branches:
      - feat/graycode-camera-capture-p520-20261104
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless
      - name: M8 hardware-free camera regression
        run: python -m pytest tests/test_m8_graycode_capture.py -q
      - name: Full Python regression
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies with Qt GUI
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless PySide6
      - name: M8 hardware-free camera regression
        run: python -m pytest tests/test_m8_graycode_capture.py -q
      - name: Full Python regression including Qt smoke
        run: python -m pytest -q
