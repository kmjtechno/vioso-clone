name: Renderer Fail-Closed Integration
on:
  push:
    branches: [fix/render-validation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux Qt runtime
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless PySide6
      - name: Renderer security-focused regression
        run: python -m pytest tests/test_m3_render_validation.py tests/test_m3_render.py tests/test_m3_preview.py -q
      - name: Full application regression
        run: python -m pytest -q
  windows:
    runs-on: windows-latest
    timeout-minutes: 16
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless PySide6
      - name: Renderer security-focused regression
        run: python -m pytest tests/test_m3_render_validation.py tests/test_m3_render.py tests/test_m3_preview.py -q
      - name: Full application regression
        run: python -m pytest -q
