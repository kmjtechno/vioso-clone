name: Synthetic Calibration Demo Integration
on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - examples/**
      - tests/test_demo.py
      - .github/workflows/demo-integration.yml
permissions:
  contents: read

jobs:
  linux-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless
      - name: Synthetic end-to-end demo and non-overwrite tests
        run: python -m pytest tests/test_demo.py -q
      - name: Full project regression at PR merge ref
        run: python -m pytest -q

  windows-demo:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless PySide6
      - name: Windows synthetic demo tests
        run: python -m pytest tests/test_demo.py -q
      - name: Full Windows regression including GUI smoke
        run: python -m pytest -q
